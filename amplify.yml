# AWS Amplify Hosting build for the frontend (docs/process/hosting-aws-amplify.md).
# Amplify hosts the static Vite build only; Supabase is the backend.
# Environment variables are set per branch in the Amplify console, never here.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Use the Node version pinned in .nvmrc (the same one CI uses).
        - nvm install
        - nvm use
        - node --version
        - npm --version
        # Fail fast: without VITE_API_MODE the site could publish the wrong API mode.
        - '[ -n "$VITE_API_MODE" ] || { echo "VITE_API_MODE is not set for this Amplify branch. Set it in App settings > Environment variables."; exit 1; }'
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
