# Security headers for every response served by AWS Amplify Hosting
# (docs/process/hosting-aws-amplify.md §6).
# The CSP was proposed by Obvious (PR #6) and checked against the production
# build: no violations on /, /ideas, /staff or /auth/sign-in. Inline styles are
# needed by React style props and Radix. connect-src allows Supabase (HTTPS + Realtime) and the Leseding AI Engine
# behind Peolwane AI; media-src blob: plays its spoken replies; microphone=(self) lets this site (only) ask for the
# microphone for voice questions (docs/process/peolwane-ai.md). script-src stays 'self': no third-party script.
customHeaders:
  - pattern: '**'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(self), geolocation=()
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://lesedingaiengine.co.bw; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
