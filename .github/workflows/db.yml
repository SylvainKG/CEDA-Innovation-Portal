# Database and Edge Function checks (docs/process/ci-and-environments.md §2, "db" job; D-42).
# Kept in its own workflow file so it never conflicts with changes to ci.yml.
#   pglite    — migrations + seed + pgTAP in PGlite (fast stand-in, same files as below)
#   supabase  — the real Supabase local stack: `supabase start` applies migrations and seed,
#               then `supabase test db` runs every pgTAP file. Disposable; needs no secrets.
#   functions — `deno check` on every Edge Function.
#   gate      — "Database gate", the ONE job to mark as required in the main ruleset.
#               It runs on every pull request: it passes at once when no database files
#               changed, and otherwise only when pglite, supabase and functions all pass.
#               (A path filter on the whole workflow would leave a required check that
#               never starts on other PRs; issue #14, item 1.)
name: Database

on:
  pull_request:
  push:
    branches: [main, 'db/**', 'test/ci-db-**']
    paths:
      - 'supabase/**'
      - 'tools/pglite-db-tests/**'
      - '.github/workflows/db.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Database files changed?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      db: ${{ steps.diff.outputs.db }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Pushes and manual runs already passed the path filter (or were asked for): always test.
          if [ "$EVENT" != "pull_request" ]; then echo "db=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE" HEAD)
          if printf '%s\n' "$files" | grep -qE '^(supabase/|tools/pglite-db-tests/|\.github/workflows/db\.yml$)'; then
            echo "db=true" >> "$GITHUB_OUTPUT"; echo "Database files changed: running the database jobs." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "db=false" >> "$GITHUB_OUTPUT"; echo "No database files changed: database jobs skipped, gate passes." >> "$GITHUB_STEP_SUMMARY"
          fi

  pglite:
    name: pgTAP (PGlite stand-in)
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/pglite-db-tests/package-lock.json
      - name: Install
        working-directory: tools/pglite-db-tests
        run: npm ci
      - name: Migrations, seed and pgTAP
        working-directory: tools/pglite-db-tests
        run: npm test

  supabase:
    name: pgTAP (Supabase local stack)
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0
      - name: Start Supabase (applies migrations and seed)
        # Services the tests do not need are left out to keep the job fast.
        # On failure the last lines become a public annotation, readable without opening the log.
        run: |
          set -o pipefail
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor 2>&1 | tee start.log || {
            echo "::error title=supabase start failed::$(tail -n 40 start.log | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }
      - name: Run pgTAP tests
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee test.log || {
            echo "::error title=supabase test db failed::$(grep -E 'not ok|Failed|ERROR|planned|Result' test.log | tail -n 40 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }
      - name: Generate TypeScript types from the migrated schema
        # The frontend copies this file into src/lib/api/ (contract §8). Download it from the run's artifacts.
        run: |
          supabase gen types typescript --local --schema public > database.types.ts
          echo "Generated $(wc -l < database.types.ts) lines for schema public" >> "$GITHUB_STEP_SUMMARY"
          test -s database.types.ts
      - uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: database.types.ts
          retention-days: 30
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  functions:
    name: Edge Functions (deno check)
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check
        # Checked from a copy outside the repository: the root package.json belongs to the
        # frontend and would make Deno resolve (and install) the frontend's dependencies.
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/fn" && cp -r supabase/functions/. "$RUNNER_TEMP/fn/"
          (cd "$RUNNER_TEMP/fn" && deno check */index.ts) 2>&1 | tee check.log || {
            echo "::error title=deno check failed::$(tail -n 40 check.log | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

  gate:
    name: Database gate
    needs: [changes, pglite, supabase, functions]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          DB: ${{ needs.changes.outputs.db }}
          PGLITE: ${{ needs.pglite.result }}
          SUPABASE: ${{ needs.supabase.result }}
          FUNCTIONS: ${{ needs.functions.result }}
        run: |
          echo "changes=$CHANGES db=$DB pglite=$PGLITE supabase=$SUPABASE functions=$FUNCTIONS"
          if [ "$CHANGES" != "success" ]; then echo "::error::Could not tell whether database files changed."; exit 1; fi
          if [ "$DB" != "true" ]; then echo "No database files changed: nothing to check."; exit 0; fi
          for r in "$PGLITE" "$SUPABASE" "$FUNCTIONS"; do
            if [ "$r" != "success" ]; then echo "::error::A database job did not pass (pglite=$PGLITE supabase=$SUPABASE functions=$FUNCTIONS)."; exit 1; fi
          done
          echo "All database jobs passed."
