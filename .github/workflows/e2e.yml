# Browser tests with Playwright (docs/testing/test-plan.md §1 and §5; QA-01, SEC-02).
# Separate from ci.yml so the two files never conflict. Not a required check yet:
# it becomes one when the negative suite (N1–N11) runs against the real backend.
name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Run against a deployed site instead of a local build (e.g. the Amplify staging URL)'
        required: false
      journey:
        description: 'Run the real-backend journey (tests/e2e/hosted-journey.spec.ts) instead of the smoke tests. Read-only unless "journey_write" is ticked. Never against judging.'
        type: boolean
        required: false
        default: false
      journey_write:
        description: 'Also run the write tests, which CREATE a case and carry it to award on staging. Only after a snapshot (#65, #68); reset afterwards.'
        type: boolean
        required: false
        default: false
      journey_local:
        description: 'Run the whole journey, writes included, against a throwaway Supabase stack started in this job (no secrets, no staging data). Use it to rehearse before a staging run.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (Chromium, 360 + 1280 px)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.journey || inputs.journey_local)) }}
        run: npm run test:e2e -- --trace off
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
      # Real-backend journey (issue #61): only a manual run with "journey" ticked gets these values; pull requests never do.
      # Without base_url it builds this checkout in Supabase mode (public URL + publishable key) and serves it on 5173.
      - name: Check the journey settings (names only, never values)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.journey && !inputs.journey_local }}
        env:
          HAS_URL: ${{ vars.SUPABASE_URL != '' }}
          HAS_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY != '' }}
          HAS_PASSWORD: ${{ secrets.DEMO_PASSWORD != '' }}
          BASE_URL: ${{ inputs.base_url }}
        run: |
          echo "variable SUPABASE_URL set: $HAS_URL | secret SUPABASE_PUBLISHABLE_KEY set: $HAS_KEY | secret DEMO_PASSWORD set: $HAS_PASSWORD"
          missing=""
          [ "$HAS_PASSWORD" = "true" ] || missing="$missing DEMO_PASSWORD(secret)"
          if [ -z "$BASE_URL" ]; then
            [ "$HAS_URL" = "true" ] || missing="$missing SUPABASE_URL(variable)"
            [ "$HAS_KEY" = "true" ] || missing="$missing SUPABASE_PUBLISHABLE_KEY(secret)"
          fi
          if [ -n "$missing" ]; then echo "::error::Missing repository settings:$missing (Settings > Secrets and variables > Actions)"; exit 1; fi
      - name: Real-backend journey
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.journey && !inputs.journey_local }}
        run: npm run test:e2e -- tests/e2e/hosted-journey.spec.ts --project=desktop-1280 --trace off
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
          E2E_LOCAL_SUPABASE: ${{ inputs.base_url == '' && '1' || '' }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          E2E_JOURNEY: '1'
          E2E_JOURNEY_WRITE: ${{ inputs.journey_write && '1' || '' }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
      # Rehearsal (journey_local): the same journey against a disposable Supabase stack in this job, built from the
      # migrations and the fictional seed. Its URL and keys are the CLI's fixed local demo values, not project secrets.
      - uses: supabase/setup-cli@v1
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.journey_local }}
        with:
          version: 2.108.0
      - name: Start a throwaway Supabase stack and set the demo passwords
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.journey_local }}
        run: |
          set -o pipefail
          DEMO_PASSWORD="$(openssl rand -hex 16)"   # a fresh throwaway password for this run's disposable stack
          echo "::add-mask::$DEMO_PASSWORD"
          export DEMO_PASSWORD
          echo "LOCAL_DEMO_PASSWORD=$DEMO_PASSWORD" >> "$GITHUB_ENV"
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor 2>&1 | tail -n 5
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-$SECRET_KEY}" node scripts/set-demo-passwords.mjs
          {
            echo "LOCAL_API_URL=$API_URL"
            echo "LOCAL_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}"
          } >> "$GITHUB_ENV"
      - name: Journey against the throwaway stack (writes included)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.journey_local }}
        run: npm run test:e2e -- tests/e2e/hosted-journey.spec.ts --project=desktop-1280 --trace off
        env:
          E2E_LOCAL_SUPABASE: '1'
          VITE_SUPABASE_URL: ${{ env.LOCAL_API_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.LOCAL_ANON_KEY }}
          E2E_JOURNEY: '1'
          E2E_JOURNEY_WRITE: '1'
          DEMO_PASSWORD: ${{ env.LOCAL_DEMO_PASSWORD }}
      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
